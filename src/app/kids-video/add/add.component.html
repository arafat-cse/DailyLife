<div class="container">
    <h2>YouTube Metadata Fetcher</h2>
    <mat-form-field appearance="fill" class="input-field">
      <mat-label>Enter YouTube Link</mat-label>
      <input matInput [(ngModel)]="youtubeLink" placeholder="Paste YouTube URL here" />
    </mat-form-field>
    <button mat-raised-button color="primary" (click)="fetchMetadata()">Get Metadata</button>
</div>
<form #kidsVideoForm ="ngForm" (ngSubmit)="saveKidsVideo()">
    <div *ngIf="videoData" class="chat-box">
      <div class="message">
        <h3>Title: {{ videoData.snippet.title }}</h3>
        <p>Description: {{ videoData.snippet.description }}</p>
        <p>Views: {{ videoData.statistics.viewCount }}</p>
        <p>Likes: {{ videoData.statistics.likeCount }}</p>
      </div> 
      <div class="form-group">
        <button mat-raised-button color="primary" [disabled]="!kidsVideoForm.valid"> Add New Video</button>
    </div>
    </div>
  </form>
