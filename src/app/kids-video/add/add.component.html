<mat-card>
    <mat-card-header>
        <mat-card-title>Add  new Video </mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <form #kidsVideoForm ="ngForm" (ngSubmit)="saveKidsVideo()">
            <div class="form-group">
                <mat-form-field class="half-with">
                    <label > Videlo link</label>
                    <input matInput placeholder="Enter Your Video List" name="videolink" [(ngModel)]="newKidsVideo.userId" required>
                    <mat-error *ngIf="kidsVideoForm.controls['videolink']?.touched && kidsVideoForm.controls['videolink']?.hasError('required')"> Video link Is required</mat-error>
                </mat-form-field>
            </div>
            <div class="form-group">
                <mat-form-field class="half-with">
                    <label > Videlo title</label>
                    <input matInput placeholder="Enter Your Video List" name="title" [(ngModel)]="newKidsVideo.title" required>
                    <mat-error *ngIf="kidsVideoForm.controls['title']?.touched && kidsVideoForm.controls['title']?.hasError('required')"> Description is required</mat-error>
                </mat-form-field>
            </div>
            <div class="form-group">
                <mat-form-field class="half-with">
                    <label > Videlo body</label>
                    <input matInput placeholder="Enter Your Video List" name="body" [(ngModel)]="newKidsVideo.description" required>
                    <mat-error *ngIf="kidsVideoForm.controls['body']?.touched && kidsVideoForm.controls['body']?.hasError('required')"> Description is required</mat-error>
                </mat-form-field>
            </div>
            <div class="form-group">
                <button mat-raised-button color="primary" [disabled]="!kidsVideoForm.valid"> Add New Video</button>
            </div>
        </form>
    </mat-card-content>
</mat-card>
