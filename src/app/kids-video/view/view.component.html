
<mat-card class="mat-card">
    <mat-card-header>
        <mat-card-title> List of Kids Video</mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <table mat-table [dataSource]="dataSource" matStort>
            <!-- <ng-component matColumnDef="select">
                <th mat-header-cell *matHeaderCellDef></th>
                <td mat-cell *matCellDef="let row">
                    <mat-checkbox></mat-checkbox>
                </td>
            </ng-component> -->
            <ng-component matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef>Id</th>
                <td mat-cell *matCellDef="let element">{{element.id}}</td>
            </ng-component> 

            <ng-component matColumnDef="userId">
                <th mat-header-cell *matHeaderCellDef>userId</th>
                <td mat-cell *matCellDef="let element">{{element.userId}}</td>
            </ng-component>

            <ng-component matColumnDef="title">
                <th mat-header-cell *matHeaderCellDef>Video Title</th>
                <td mat-cell *matCellDef="let element">{{element.title}}</td>
            </ng-component>

            <ng-component matColumnDef="categories">
                <th mat-header-cell *matHeaderCellDef>categories</th>
                <td mat-cell *matCellDef="let element">{{element.categories}}</td>
            </ng-component>

            <ng-component matColumnDef="description">
                <th mat-header-cell *matHeaderCellDef>Description</th>
                <td mat-cell *matCellDef="let element">{{element.description}}</td>
            </ng-component>

            <ng-component matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef>Actions</th>
                <td mat-cell *matCellDef="let element">
                    <a [routerLink]="['view',element.id]"> 
                        <mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="visibility_off"></mat-icon>
                    </a> 
                    <a [routerLink]="['edit',element.id]">
                        <mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="edit"></mat-icon>
                    </a>
                    <a [routerLink]="['delete',element.id]">
                        <mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="delete"></mat-icon>
                    </a>
                </td>
            </ng-component>

                <tr mat-header-row *matHeaderRowDef="displayColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayColumns;"></tr>
        </table>
        <mat-paginator [pageSizeOptions]="[5,10,15,20]"
        showFirstLastButtons>
    </mat-paginator>

    </mat-card-content>
</mat-card>
